name: CI (Markdown)

on:
  workflow_call:
    inputs:
      glob:
        description: Glob pattern for Markdown files
        type: string
        default: "**/*.md"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: h13/.github/actions/apply-org-config@ed7cb040c504b6000a02656ef03fa9bfd14ac3da # main
        with:
          config-file: .markdownlint-cli2.yaml

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - run: npx markdownlint-cli2 "${{ inputs.glob }}"
